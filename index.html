<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carte de visite numérique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link
href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&fa
mily=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap"
rel="stylesheet">
<style>
:root{
--ink:#12181B;
--ink-2:#1B2327;
--paper:#F3EEE3;
--paper-2:#EAE3D4;
--accent:#B8834A;
--accent-2:#3D6B5C;
--text:#241F19;
--text-muted:#7A7266;
--radius:16px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
min-height:100vh;
background:
radial-gradient(circle at 50% -10%, #223034 0%, var(--ink) 55%);
font-family:'Space Grotesk', sans-serif;
color:var(--text);
display:flex;
align-items:center;
justify-content:center;
padding:32px 16px;
}
.card{
width:100%;
max-width:400px;
background:var(--paper);
border-radius:var(--radius);
border:1px solid rgba(184,131,74,0.4);
box-shadow:0 30px 60px -20px rgba(0,0,0,0.6);
overflow:hidden;
position:relative;
}
.card::before{
content:"";
position:absolute;
top:0;left:0;right:0;
height:4px;
background:linear-gradient(90deg,var(--accent-2),var(--accent));
}
.card-inner{padding:32px 28px 24px;}
.photo-wrap{
width:96px;height:96px;
margin:0 auto 18px;
border-radius:50%;
border:2px solid var(--accent);
padding:4px;
}
.photo-wrap img{
width:100%;height:100%;
border-radius:50%;
object-fit:cover;
display:block;
background:var(--paper-2);
}
.identity{text-align:center;margin-bottom:22px;}
.identity h1{
font-family:'Fraunces', serif;
font-weight:600;
font-size:1.55rem;
margin:0 0 6px;
letter-spacing:-0.01em;
}
.profession-tag{
display:inline-block;
font-family:'JetBrains Mono', monospace;
font-size:0.68rem;
letter-spacing:0.08em;
text-transform:uppercase;
color:var(--accent-2);
background:rgba(61,107,92,0.1);
border:1px solid rgba(61,107,92,0.35);
border-radius:999px;
padding:5px 12px;
}
.dossier{
border-top:1px solid var(--paper-2);
padding-top:16px;
margin-bottom:20px;
}
.field{
display:flex;
align-items:center;
gap:12px;
padding:11px 0;
border-bottom:1px dashed rgba(122,114,102,0.3);
text-decoration:none;
color:var(--text);
}
.field:last-child{border-bottom:none;}
.field-label{
font-family:'JetBrains Mono', monospace;
font-size:0.62rem;
letter-spacing:0.06em;
text-transform:uppercase;
color:var(--text-muted);
width:78px;
flex-shrink:0;
}
.field-value{
flex:1;
font-size:0.92rem;
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;
}
.field-icon{
width:34px;height:34px;
border-radius:9px;
background:var(--ink-2);
color:var(--paper);
display:flex;
align-items:center;
justify-content:center;
flex-shrink:0;
font-size:0.95rem;
}
.socials{
display:grid;
grid-template-columns:1fr 1fr 1fr;
gap:8px;
margin-bottom:20px;
}
.social-btn{
display:flex;
flex-direction:column;
align-items:center;
gap:6px;
padding:12px 6px;
border-radius:12px;
text-decoration:none;
font-family:'JetBrains Mono', monospace;
font-size:0.6rem;
letter-spacing:0.03em;
text-transform:uppercase;
color:var(--paper);
transition:transform .15s ease;
}
.social-btn:active{transform:scale(0.96);}
.social-btn .glyph{font-size:1.15rem;}
.social-btn.fb{background:#1B4B91;}
.social-btn.ig{background:linear-gradient(135deg,#f09433,#dc2743,#bc1888);}
.social-btn.tt{background:#12181B;}
.primary-btn{
display:flex;
align-items:center;
justify-content:center;
gap:10px;
width:100%;
padding:15px;
border:none;
border-radius:12px;
background:var(--accent);
color:#fff;
font-family:'Space Grotesk', sans-serif;
font-weight:600;
font-size:0.92rem;
cursor:pointer;
transition:filter .15s ease;
}
.primary-btn:hover{filter:brightness(1.06);}
.primary-btn:active{filter:brightness(0.94);}
.footnote{
text-align:center;
margin-top:14px;
font-size:0.68rem;
color:var(--text-muted);
}
a:focus-visible, button:focus-visible{
outline:2px solid var(--accent-2);
outline-offset:2px;
}
@media (prefers-reduced-motion:reduce){
.social-btn, .primary-btn{transition:none;}
}
</style>
</head>
<body>
<div class="card">
<div class="card-inner">
<div class="photo-wrap">
<img src="c:\Users\DELL\Desktop\MORY WORLD\image\file_00000000dd3071f490eb3a647e0c77fa.png" alt="" srcset="">
</div>
<div class="identity">
<h1 id="nom">Ouattara Mory</h1>
<span class="profession-tag" id="profession">Etudiant en Marketing Digital</span>
</div>
<!-- Champs de contact : chaque champ a une action de code différente -->
<div class="dossier">
<!-- TÉLÉPHONE : lien tel: → ouvre le composeur d'appel du téléphone -->
<a class="field" id="lien-tel" href="tel:+2250576206420">
<span class="field-icon">📞</span>
<span class="field-label">Tél.</span>
<span class="field-value" id="valeur-tel">+2250576206420</span>
</a>
<!-- EMAIL : lien mailto: → ouvre l'application mail avec destinataire pré-rempli -->
<a class="field" id="lien-mail" href="ouattaramory2006@gmail.com">
<span class="field-icon">✉️</span>
<span class="field-label">Mail</span>
<span class="field-value" id="valeur-mail">ouattaramory2006@gmail.com</span>
</a>
<!-- WHATSAPP : lien wa.me → ouvre directement une conversation WhatsApp -->
<a class="field" id="lien-whatsapp" href="https://wa.me/+2250576206420" target="_blank"
rel="noopener">
<span class="field-icon">💬</span>
<span class="field-label">WhatsApp</span>
<span class="field-value">Discuter directement</span>
</a>
</div>
<!-- RÉSEAUX SOCIAUX : simples liens href vers le profil, l'action (ami/abonnement) se fait
sur la plateforme -->
<div class="socials">
<a class="social-btn fb" href="https://facebook.com/garaga.lechoco" target="_blank"
rel="noopener">
<span class="glyph">👤</span>
Ajouter ami(e)


</a>
</div>
<!-- ENREGISTRER LE CONTACT : génère un fichier .vcf (vCard) via JavaScript,
c'est le seul moyen d'enregistrer nom + tél + mail directement dans le
répertoire du téléphone en un seul geste -->
<button class="primary-btn" onclick="enregistrerContact()">
⬇ Enregistrer le contact
</button>
<p class="footnote">Ajoute cette fiche à tes contacts en un clic</p>
</div>
</div>
<script>
function enregistrerContact(){
const nom = document.getElementById('nom').textContent.trim();
const profession = document.getElementById('profession').textContent.trim();
const tel = document.getElementById('lien-tel').href.replace('tel:', '');
const mail = document.getElementById('lien-mail').href.replace('mailto:', '');
const whatsapp = document.getElementById('lien-whatsapp').href;
const vCard = [
'BEGIN:VCARD',
'VERSION:3.0',
`FN:${nom}`,
`TITLE:${profession}`,
`TEL;TYPE=CELL:${tel}`,
`EMAIL:${mail}`,
`IMPP:${whatsapp}`,
`URL:${whatsapp}`,
'END:VCARD'
].join('\n');
const blob = new Blob([vCard], { type: 'text/vcard' });
const url = URL.createObjectURL(blob);
const lien = document.createElement('a');
lien.href = url;
lien.download = nom.replace(/\s+/g, '_') + '.vcf';
document.body.appendChild(lien);
lien.click();
document.body.removeChild(lien);
URL.revokeObjectURL(url);
}
</script>
</body>
</html>
